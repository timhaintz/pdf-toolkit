version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    # Review the supported VS Code API version when preparing a release.
    # Keep patch updates eligible without raising the minimum automatically.
    ignore:
      - dependency-name: '@types/vscode'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      npm-development:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
      actions-nonbreaking:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
