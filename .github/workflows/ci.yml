name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PDF_TOOLKIT_VSCODE_EXECUTABLE: ''
      PDF_TOOLKIT_VSCODE_VERSION: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Package local VSIX
        run: npm run package:vsix
      - name: Read minimum supported VS Code version
        id: vscode
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const engine = require('./package.json').engines.vscode;
          const minimum = /^\^(\d+\.\d+\.\d+)$/.exec(engine);
          if (!minimum) throw new Error('Expected an exact caret range for engines.vscode');
          console.log('minimum=' + minimum[1]);
          NODE
      - name: Test source and packaged extension in latest stable VS Code (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration -- --packaged
      - name: Test source and packaged extension in latest stable VS Code (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration -- --packaged
      - name: Test source and packaged extension in minimum VS Code (Linux)
        if: runner.os == 'Linux'
        env:
          PDF_TOOLKIT_VSCODE_VERSION: ${{ steps.vscode.outputs.minimum }}
        run: xvfb-run -a npm run test:integration -- --packaged
      - name: Test source and packaged extension in minimum VS Code (Windows)
        if: runner.os == 'Windows'
        env:
          PDF_TOOLKIT_VSCODE_VERSION: ${{ steps.vscode.outputs.minimum }}
        run: npm run test:integration -- --packaged
